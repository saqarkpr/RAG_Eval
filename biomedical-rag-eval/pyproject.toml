[project]
name = "biomedical-rag-eval"
version = "0.1.0"
description = "Retrieval-augmented QA over PubMed abstracts, evaluated for calibration and faithfulness, not just accuracy."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Kept deliberately small: this is a research-evaluation repo, not a
# library, so we lint for real bugs (unused imports/names, undefined
# names) rather than enforcing a large style surface.
select = ["E", "F", "W"]
